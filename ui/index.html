<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --bg: #04080f;
    --cyan: #4fd8ff;
    --cyan-dim: rgba(79, 216, 255, 0.35);
    --amber: #ffb457;
    --red: #ff5c6c;
    --text: #cfe9f5;
    --muted: rgba(207, 233, 245, 0.55);
    --panel: rgba(8, 20, 34, 0.55);
    --line: rgba(79, 216, 255, 0.18);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --quick: 150ms; --std: 400ms; --slow: 800ms;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(20, 60, 90, 0.35), transparent 60%),
                repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.012) 3px 4px); }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .hud { position: fixed; padding: 14px 18px; background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(8px); border-radius: 6px; opacity: 0; transform: translateY(14px);
    transition: opacity var(--slow) var(--ease), transform var(--slow) var(--ease); }
  .hud::before, .hud::after { content: ""; position: absolute; width: 14px; height: 14px; border-color: var(--cyan); border-style: solid; }
  .hud::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .hud::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  body.booted .hud { opacity: 1; transform: none; }
  .hud h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); font-weight: 600; }

  #title { top: 22px; left: 24px; padding: 10px 18px; transition-delay: 80ms; }
  #title .name { font-size: 26px; letter-spacing: 8px; font-weight: 300; color: #fff; text-shadow: 0 0 18px var(--cyan-dim); }
  #title .sub { font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-top: 2px; }

  #status { top: 22px; left: 50%; transform: translate(-50%, 14px); padding: 8px 22px; text-align: center; transition-delay: 160ms; }
  body.booted #status { transform: translate(-50%, 0); }
  #status .state { font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: var(--cyan); transition: color var(--std) var(--ease); }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); margin-right: 10px;
    box-shadow: 0 0 10px var(--cyan); vertical-align: middle; transition: background var(--std), box-shadow var(--std); }
  body[data-state="thinking"] #status .state, body[data-state="tool"] #status .state { color: var(--amber); }
  body[data-state="thinking"] #status .dot, body[data-state="tool"] #status .dot { background: var(--amber); box-shadow: 0 0 10px var(--amber); animation: blink 0.9s var(--ease) infinite; }
  body[data-state="speaking"] #status .dot { animation: blink 0.5s var(--ease) infinite; }
  body[data-state="idle"] #status .state { color: var(--muted); }
  body[data-state="idle"] #status .dot { background: var(--muted); box-shadow: none; }
  @keyframes blink { 50% { opacity: 0.25; } }

  #stats { top: 22px; right: 24px; width: 250px; transition-delay: 240ms; }
  .bar { height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; margin: 5px 0 9px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), #9ef); transition: width var(--slow) var(--ease); }
  .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .row b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }

  #log { left: 24px; bottom: 96px; width: 380px; max-height: 46vh; overflow-y: auto; transition-delay: 320ms; }
  #log, #tools { overflow-x: hidden; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  #log::-webkit-scrollbar, #tools::-webkit-scrollbar { width: 4px; }
  #log::-webkit-scrollbar-thumb, #tools::-webkit-scrollbar-thumb { background: var(--line); }
  .msg { margin: 0 0 10px; font-size: 13px; line-height: 1.45; opacity: 0; transform: translateX(-10px);
    animation: msgin var(--std) var(--ease) forwards; }
  @keyframes msgin { to { opacity: 1; transform: none; } }
  .msg .who { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--cyan); margin-bottom: 2px; }
  .msg.user .who { color: var(--muted); }
  .msg.heard { color: var(--muted); font-style: italic; font-size: 12px; }
  .msg.error { color: var(--red); }

  #tools { right: 24px; bottom: 96px; width: 300px; max-height: 40vh; overflow-y: auto; transition-delay: 400ms; }
  .tool { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; margin: 0 0 8px; padding: 6px 8px;
    border-left: 2px solid var(--amber); background: rgba(255, 180, 87, 0.06); opacity: 0; animation: msgin var(--std) var(--ease) forwards; }
  .tool .n { color: var(--amber); }
  .tool .r { color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 60px; overflow: hidden; }

  #input { left: 50%; bottom: 24px; transform: translate(-50%, 14px); width: min(760px, 92vw); padding: 10px 12px;
    display: flex; gap: 8px; align-items: center; transition-delay: 480ms; }
  body.booted #input { transform: translate(-50%, 0); }
  #input input { flex: 1; background: transparent; border: 0; border-bottom: 1px solid var(--line); color: #fff;
    font-size: 15px; padding: 8px 6px; outline: none; font-family: inherit; transition: border-color var(--quick); }
  #input input:focus { border-color: var(--cyan); }
  button { background: transparent; color: var(--cyan); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: inherit;
    transition: background var(--quick) var(--ease), transform var(--quick) var(--ease), border-color var(--quick); }
  button:hover { background: rgba(79, 216, 255, 0.1); border-color: var(--cyan); }
  button:active { transform: scale(0.96); }
  button.off { color: var(--red); border-color: rgba(255, 92, 108, 0.4); }

  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10;
    transition: opacity var(--slow) var(--ease); font-size: 12px; letter-spacing: 3px; color: var(--cyan); text-transform: uppercase; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .steps { margin-top: 220px; text-align: center; line-height: 2; }
  #boot .steps div { opacity: 0.35; } #boot .steps div.on { opacity: 1; }
  /* ---- Vue projets : la sphère se range en bas à gauche, les projets occupent l'écran ---- */
  #scene { transform-origin: 0 100%; transition: transform var(--slow) var(--ease); will-change: transform; }
  /* Colonne de gauche : conversation en haut, sphère en bas. Colonne de droite : les projets. */
  /* origine en bas à gauche : après scale(0.36), le centre de la sphère tombe vers 18 % de la largeur et 82 % de la hauteur */
  body.view-projects #scene { transform: translate(-1vw, -1vh) scale(0.5); }
  body.view-projects #tools, body.view-projects #stats { opacity: 0; pointer-events: none; transform: translateY(14px); }
  body.view-projects #log { left: 24px; top: 92px; bottom: auto; width: calc(35vw - 24px); max-height: 32vh; }
  body.view-projects #input { left: auto; right: 24px; transform: none; width: calc(62vw - 24px); }
  #projects { position: fixed; top: 92px; right: 24px; bottom: 100px; left: 38vw; display: none; overflow: auto; }
  body.view-projects #projects { display: block; }
  #projects::-webkit-scrollbar { width: 4px; } #projects::-webkit-scrollbar-thumb { background: var(--line); }
  #projects .head { display: flex; align-items: baseline; gap: 18px; margin: 0 0 18px 4px; }
  #projects h1 { margin: 0; font-size: 22px; letter-spacing: 6px; font-weight: 300; color: #fff; text-shadow: 0 0 18px var(--cyan-dim); }
  #projects .count { color: var(--muted); font-size: 12px; letter-spacing: 2px; }
  #projects .back { margin-left: auto; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; align-items: start; }
  .proj { position: relative; padding: 14px 16px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    backdrop-filter: blur(8px); cursor: pointer; opacity: 0; transform: translateY(16px);
    animation: projin var(--std) var(--ease) forwards; transition: border-color var(--quick), transform var(--quick) var(--ease), box-shadow var(--std); }
  .proj:hover { border-color: var(--cyan); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(79,216,255,0.12); }
  .proj.linked { border-color: rgba(255,180,87,0.45); }
  .proj.linked::after { content: "lié"; position: absolute; top: 10px; right: 12px; font-size: 9px; letter-spacing: 2px; color: var(--amber); text-transform: uppercase; }
  .proj.github { border-style: dashed; }
  .proj.github .k { color: #b8a6ff; }
  .proj.github::before { content: "GitHub"; position: absolute; top: 10px; right: 12px; font-size: 9px; letter-spacing: 2px; color: #b8a6ff; text-transform: uppercase; }
  .proj.github.linked::before { right: 44px; }
  .proj .k { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--cyan); }
  .proj .n { font-size: 17px; color: #fff; margin: 2px 0 6px; font-weight: 500; }
  .proj .m { font-size: 11px; color: var(--muted); }
  .proj .br { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .proj .br span { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 8px; font-size: 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--text); font-family: Consolas, monospace; }
  .proj .br span.cur { border-color: var(--cyan); color: var(--cyan); }
  .proj .br span.more { color: var(--muted); border-style: dashed; }
  .proj .lk { margin-top: 8px; font-size: 11px; color: var(--amber); }
  @keyframes projin { to { opacity: 1; transform: none; } }

  /* ---- Vue agenda : même disposition que les projets ---- */
  body.view-agenda #scene { transform: translate(-1vw, -1vh) scale(0.5); }
  body.view-agenda #tools, body.view-agenda #stats { opacity: 0; pointer-events: none; transform: translateY(14px); }
  body.view-agenda #log { left: 24px; top: 92px; bottom: auto; width: calc(35vw - 24px); max-height: 32vh; }
  body.view-agenda #input { left: auto; right: 24px; transform: none; width: calc(62vw - 24px); }
  #agenda { position: fixed; top: 92px; right: 24px; bottom: 100px; left: 38vw; display: none; overflow: auto; }
  body.view-agenda #agenda { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-content: start; }
  #agenda .head { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 18px; margin: 0 0 4px 4px; }
  #agenda h1 { margin: 0; font-size: 22px; letter-spacing: 6px; font-weight: 300; color: #fff; text-shadow: 0 0 18px var(--cyan-dim); }
  #agenda .month { color: var(--cyan); font-size: 13px; letter-spacing: 3px; text-transform: uppercase; min-width: 190px; }
  #agenda .head button { padding: 5px 10px; }
  #agenda .back { margin-left: auto; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal .dow { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-align: center; padding: 4px 0 6px; }
  .day { min-height: 92px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    opacity: 0; transform: translateY(10px); animation: projin var(--std) var(--ease) forwards; }
  .day.other { animation-name: dayin; }
  @keyframes dayin { to { opacity: 0.35; transform: none; } }
  .day .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .day.today { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan-dim); }
  .day.today .n { color: var(--cyan); font-weight: 600; }
  .evt { margin-top: 5px; padding: 3px 7px; font-size: 11px; line-height: 1.3; border-radius: 4px; background: rgba(79,216,255,0.12);
    border-left: 2px solid var(--cyan); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evt b { color: var(--cyan); font-weight: 500; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .upcoming { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; align-self: start; }
  .upcoming h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); }
  .up { padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .up:first-of-type { border-top: 0; }
  .up .w { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .up .t { color: #fff; }
  .up .no { font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 12px; }
  /* ---- Vues journée, journal, sport : même disposition que l'agenda ---- */
  body.view-day #scene, body.view-journal #scene, body.view-sport #scene { transform: translate(-1vw, -1vh) scale(0.5); }
  body.view-day #tools, body.view-day #stats, body.view-journal #tools, body.view-journal #stats, body.view-sport #tools, body.view-sport #stats { opacity: 0; pointer-events: none; transform: translateY(14px); }
  body.view-day #log, body.view-journal #log, body.view-sport #log { left: 24px; top: 92px; bottom: auto; width: calc(35vw - 24px); max-height: 32vh; }
  body.view-day #input, body.view-journal #input, body.view-sport #input { left: auto; right: 24px; transform: none; width: calc(62vw - 24px); }
  .vue { position: fixed; top: 92px; right: 24px; bottom: 100px; left: 38vw; display: none; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .vue::-webkit-scrollbar { width: 4px; } .vue::-webkit-scrollbar-thumb { background: var(--line); }
  body.view-day #day, body.view-journal #journal, body.view-sport #sport { display: block; }
  .vue .head { display: flex; align-items: baseline; gap: 18px; margin: 0 0 16px 4px; flex-wrap: wrap; }
  .vue h1 { margin: 0; font-size: 22px; letter-spacing: 6px; font-weight: 300; color: #fff; text-shadow: 0 0 18px var(--cyan-dim); }
  .vue .sub { color: var(--muted); font-size: 12px; letter-spacing: 2px; }
  .vue .back { margin-left: auto; }
  .vue .head button { padding: 5px 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; align-items: start; }
  .card { padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(8px);
    opacity: 0; transform: translateY(14px); animation: projin var(--std) var(--ease) forwards; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); }
  .card .big { font-size: 26px; color: #fff; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .card .small { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; }
  .card .line { padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; display: flex; gap: 10px; align-items: baseline; }
  .card .line:first-of-type { border-top: 0; }
  .card .line .w { color: var(--muted); font-size: 11px; min-width: 92px; letter-spacing: 1px; flex-shrink: 0; }
  .card .line .t { color: #fff; }
  .card .line .soon { color: var(--amber); }
  .card .line .now { color: var(--cyan); }
  .jl { font-family: Consolas, "Courier New", monospace; font-size: 12px; padding: 6px 10px; border-left: 2px solid var(--cyan); margin: 0 0 6px;
    background: rgba(79,216,255,0.05); opacity: 0; animation: msgin var(--std) var(--ease) forwards; }
  .jl.erreur, .jl.bloquee, .jl.refusee { border-color: var(--red); background: rgba(255,92,108,0.06); }
  .jl.echec, .jl.attente { border-color: var(--amber); background: rgba(255,180,87,0.06); }
  .jl .t { color: var(--muted); margin-right: 8px; } .jl .n { color: var(--cyan); } .jl .a { color: var(--text); }
  .jl .r { color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 44px; overflow: hidden; margin-top: 2px; }
  .jl .s { float: right; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .jl.erreur .s, .jl.bloquee .s, .jl.refusee .s { color: var(--red); } .jl.echec .s, .jl.attente .s { color: var(--amber); }
  #journal .actions { display: flex; gap: 10px; margin: 0 0 14px 4px; align-items: center; flex-wrap: wrap; }
  button.danger { color: var(--red); border-color: rgba(255,92,108,0.5); } button.danger:hover { background: rgba(255,92,108,0.12); border-color: var(--red); }
  .badge { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.on { color: var(--red); border-color: var(--red); animation: blink 0.9s var(--ease) infinite; }
  .chart { width: 100%; height: 110px; display: block; margin-top: 8px; }
  .chart .l { fill: none; stroke: var(--cyan); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .p { fill: var(--cyan); } .chart .p.last { fill: #fff; }
  .chart text { fill: var(--muted); font-size: 10px; font-family: inherit; }
  .chart .g { stroke: var(--line); stroke-width: 1; }
  .photos { display: flex; gap: 10px; flex-wrap: wrap; } .photos img { height: 170px; border-radius: 4px; border: 1px solid var(--line); }
  .photos figure { margin: 0; text-align: center; } .photos figcaption { font-size: 11px; color: var(--muted); margin-top: 4px; }
  @media (prefers-reduced-motion: reduce) { .hud, .msg, .tool, .proj, .card, .jl { transition: none; animation: none; opacity: 1; transform: none; } }
</style>
</head>
<body data-state="loading">
<canvas id="scene"></canvas>

<div id="boot"><div class="steps" id="bootsteps"><div class="on">Initialisation des systèmes</div></div></div>

<div class="hud" id="title"><div class="name" id="name">J.A.R.V.I.S.</div><div class="sub" id="model">—</div></div>
<div class="hud" id="status"><span class="dot"></span><span class="state" id="state">Chargement</span></div>
<div class="hud" id="stats">
  <h2>Systèmes</h2>
  <div class="row"><span>Mémoire GPU</span><b id="vram">—</b></div><div class="bar"><i id="vrambar"></i></div>
  <div class="row"><span>Charge GPU</span><b id="util">—</b></div><div class="bar"><i id="utilbar"></i></div>
  <div class="row"><span>Température</span><b id="temp">—</b></div>
  <div class="row" style="margin-top:6px"><span>Réseau</span><b id="net">local uniquement</b></div>
</div>
<div id="projects">
  <div class="head"><h1>PROJETS</h1><span class="count" id="pcount"></span><button class="back" id="pback">Retour</button></div>
  <div class="pgrid" id="pgrid"></div>
</div>
<div id="agenda">
  <div class="head"><h1>AGENDA</h1><button id="aprev" title="Mois précédent">‹</button><span class="month" id="amonth"></span><button id="anext" title="Mois suivant">›</button><button class="back" id="aback">Retour</button></div>
  <div class="cal" id="acal"></div>
  <div class="upcoming"><h2>À venir</h2><div id="aup"></div></div>
</div>
<div class="vue" id="day">
  <div class="head"><h1>JOURNÉE</h1><span class="sub" id="daylabel"></span><button id="dayrefresh" title="Actualiser">↻</button><button class="back" data-back>Retour</button></div>
  <div class="cards" id="daycards"></div>
</div>
<div class="vue" id="journal">
  <div class="head"><h1>JOURNAL</h1><span class="sub" id="jsub"></span><span class="badge" id="jarret">arrêt d'urgence</span><button class="back" data-back>Retour</button></div>
  <div class="actions"><button id="jundo">Annuler la dernière action</button><button class="danger" id="jstop">Arrêt d'urgence</button><button id="jresume">Reprendre</button><button id="jrefresh">↻</button></div>
  <div id="jlist"></div>
</div>
<div class="vue" id="sport">
  <div class="head"><h1>SPORT</h1><span class="sub" id="ssub"></span><button id="srefresh" title="Actualiser">↻</button><button class="back" data-back>Retour</button></div>
  <div class="cards" id="scards"></div>
</div>
<div class="hud" id="log"><h2>Conversation</h2><div id="msgs"></div></div>
<div class="hud" id="tools"><h2>Outils</h2><div id="toollist"><div style="font-size:12px;color:var(--muted)">Aucun outil utilisé pour l'instant.</div></div></div>
<form class="hud" id="input" autocomplete="off">
  <input id="txt" placeholder="Écris à Jarvis, ou dis « Bonjour Jarvis »…" autocomplete="off">
  <button type="button" id="wake" title="Réveiller">Réveil</button>
  <button type="button" id="stop" title="Couper la parole">Stop</button>
  <button type="button" id="mic" title="Micro">Micro</button>
</form>

<script>
// ------------------------------------------------------------------ état
const S = { state: 'loading', awake: false, level: 0, target: 0, src: 'mic', speech: false, mix: {}, t0: performance.now(), lastLevel: 0 };
const STATES = ['idle', 'listening', 'thinking', 'tool', 'speaking', 'loading'];
STATES.forEach(s => S.mix[s] = s === 'loading' ? 1 : 0);
const LABEL = { loading: 'Chargement', idle: 'En veille', listening: 'À l’écoute', thinking: 'Réflexion', tool: 'Outil en cours', speaking: 'Réponse' };
const $ = id => document.getElementById(id);

function setState(state, awake) {
  S.state = state; S.awake = awake;
  document.body.dataset.state = state;

// ------------------------------------------------------------------ WebSocket
let ws, retry = 800;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { retry = 800; };
  ws.onclose = () => { setTimeout(connect, retry); retry = Math.min(retry * 1.5, 5000); };
  ws.onmessage = e => handle(JSON.parse(e.data));
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function handle(ev) {
  switch (ev.type) {
    case 'hello':
      if (ev.boot) { if (S.boot && S.boot !== ev.boot) { location.reload(); return; } S.boot = ev.boot; }
      $('name').textContent = ev.name.toUpperCase().split('').join('.') + '.';
      $('model').textContent = `${ev.model} · 100 % local`;
      $('mic').classList.toggle('off', !ev.mic);
      (ev.history || []).forEach(handle);
      setState(ev.state, ev.awake);
      if (ev.state !== 'loading') boot();
      break;
    case 'loading': {
      const box = $('bootsteps');
      [...box.children].forEach(c => c.classList.remove('on'));
      const d = document.createElement('div'); d.className = 'on'; d.textContent = ev.step; box.appendChild(d);
      if (ev.done) setTimeout(boot, 600);
      break;
    }
    case 'model': $('model').textContent = `${ev.model} · 100 % local`; addMsg('heard', '', `Modèle : ${ev.model}`); break;
    case 'view': setView(ev.view, ev.projects, ev); break;
    case 'agenda': A.events = ev.events || []; A.today = ev.today; if (document.body.classList.contains('view-agenda')) renderAgenda(); break;
    case 'agenda_goto': A.year = ev.year; A.month = ev.month; if (document.body.classList.contains('view-agenda')) renderAgenda(); break;
    case 'state': setState(ev.state, ev.awake); if (ev.standby && ev.state === 'idle') $('state').textContent = 'Veille profonde'; break;
    case 'standby': if (ev.on) { $('state').textContent = 'Veille profonde'; } else if (S.state === 'idle') { $('state').textContent = LABEL.idle; } break;
    case 'level': S.src = ev.src; S.target = Math.min(1, ev.v * (ev.src === 'mic' ? 12 : 5)); S.speech = ev.speech; S.lastLevel = performance.now(); break;
    case 'heard': if (!ev.for_me) addMsg('heard', '', `« ${ev.text} » (pas pour moi)`); else addMsg('heard', '', `🔔 « ${ev.text} »`); break;
    case 'user': addMsg('user', 'Toi', ev.text); break;
    case 'assistant': addMsg('ai', $('name').textContent, ev.text + (ev.seconds ? `  ·  ${ev.seconds}s` : '')); break;
    case 'tool': addTool(ev); if (currentView === 'journal') { const x = jlEntry({ t: new Date().toISOString(), outil: ev.name, args: ev.args, statut: 'ok', detail: (ev.result || '').slice(0, 160) }); $('jlist').prepend(x); } break;
    case 'error': addMsg('error', 'Erreur', ev.text); break;
    case 'stats':
      $('vram').textContent = `${ev.vram_used.toFixed(1)} / ${ev.vram_total.toFixed(0)} Go`;
      $('vrambar').style.width = (100 * ev.vram_used / ev.vram_total) + '%';
      $('util').textContent = `${ev.gpu_util.toFixed(0)} %`; $('utilbar').style.width = ev.gpu_util + '%';
      $('temp').textContent = `${ev.gpu_temp.toFixed(0)} °C`;
      break;
  }
}

function chart(points, key) {
  const W = 420, H = 110, m = 18;
  const vals = points.map(p => p[key]); const lo = Math.min(...vals), hi = Math.max(...vals);
  const x = i => m + (points.length > 1 ? i / (points.length - 1) : 0.5) * (W - 2 * m);
  const y = v => hi === lo ? H / 2 : H - m - (v - lo) / (hi - lo) * (H - 2 * m);
  const ns = 'http://www.w3.org/2000/svg'; const s = document.createElementNS(ns, 'svg'); s.setAttribute('viewBox', `0 0 ${W} ${H}`); s.setAttribute('class', 'chart');
  [lo, hi].forEach(v => { const g = document.createElementNS(ns, 'line'); g.setAttribute('class', 'g'); g.setAttribute('x1', m); g.setAttribute('x2', W - m); g.setAttribute('y1', y(v)); g.setAttribute('y2', y(v)); s.appendChild(g);
    const t = document.createElementNS(ns, 'text'); t.setAttribute('x', 0); t.setAttribute('y', y(v) + 3); t.textContent = `${v}`; s.appendChild(t); });
  const path = document.createElementNS(ns, 'path'); path.setAttribute('class', 'l'); path.setAttribute('d', points.map((p, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(p[key])).join(' ')); s.appendChild(path);
  points.forEach((p, i) => { const c = document.createElementNS(ns, 'circle'); c.setAttribute('class', 'p' + (i === points.length - 1 ? ' last' : '')); c.setAttribute('cx', x(i)); c.setAttribute('cy', y(p[key])); c.setAttribute('r', 3);
    const title = document.createElementNS(ns, 'title'); title.textContent = `${p.date} : ${p[key]}` + (p.series ? ` (${p.series}×${p.reps})` : ''); c.appendChild(title); s.appendChild(c); });
  if (points.length) { const t = document.createElementNS(ns, 'text'); t.setAttribute('x', m); t.setAttribute('y', H - 2); t.textContent = points[0].date.slice(5); s.appendChild(t);
    const t2 = document.createElementNS(ns, 'text'); t2.setAttribute('x', W - m - 30); t2.setAttribute('y', H - 2); t2.textContent = points[points.length - 1].date.slice(5); s.appendChild(t2); }
  return s;
}

  const t = (now - S.t0) / 1000;

  // Transition d'état : 500 ms, easing doux
  for (const s of STATES) S.mix[s] = lerp(S.mix[s], s === S.state ? 1 : 0, 1 - Math.pow(0.001, dt / 0.5));
  const m = S.mix, col = mixedColor();
  const energy = m.listening * 0.35 + m.thinking * 0.8 + m.tool * 1 + m.speaking * 0.6 + m.loading * 0.5;

  // Niveau sonore : attaque rapide, retombée lente. Sans nouvelle mesure depuis 300 ms, on retombe.
  if (now - S.lastLevel > 300) S.target = 0;
  S.level = S.target > S.level ? lerp(S.level, S.target, 1 - Math.pow(0.001, dt / 0.06)) : lerp(S.level, S.target, 1 - Math.pow(0.001, dt / 0.35));
  wave.push(S.level); wave.shift();

  const breathe = 0.5 + 0.5 * Math.sin(t * (reduced ? 0 : 1.2));         // respiration 5 s en veille
  const pulse = 1 + 0.03 * breathe * m.idle + S.level * 0.22;
  const speed = reduced ? 0 : 0.12 + energy * 0.9;
  rot += dt * speed; sweep += dt * (0.9 + m.listening * 1.5);

  ctx.clearRect(0, 0, W, H);

  // --- Ambiant : grille polaire discrète + hexagone lent
  ctx.save(); ctx.translate(CX, CY);
  ctx.strokeStyle = rgba(col, 0.05); ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) { ctx.beginPath(); ctx.arc(0, 0, R * (0.9 + i * 0.55), 0, Math.PI * 2); ctx.stroke(); }
  ctx.rotate(-rot * 0.15); ctx.strokeStyle = rgba(col, 0.08); ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2, rr = R * 2.9; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.stroke();
  ctx.restore();

  // --- Halo
  const halo = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * (2.2 + S.level));
  halo.addColorStop(0, rgba(col, 0.22 + S.level * 0.25 + energy * 0.08)); halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);

  // --- Particules en orbite (secondaire) : s'écartent avec la voix
  for (const p of particles) {
    p.a += dt * p.s * (1 + energy * 2.5);
    const rr = R * (p.r + S.level * 0.5 * p.z + Math.sin(t * 0.7 + p.z * 9) * 0.05);
    const x = CX + Math.cos(p.a) * rr, y = CY + Math.sin(p.a) * rr * 0.98;
    ctx.fillStyle = rgba(col, p.o * (0.35 + energy * 0.5 + S.level * 0.4));
    ctx.fillRect(x, y, 1.6 + p.z, 1.6 + p.z);
  }

  // --- Anneaux d'arcs (primaire) : 3 anneaux, sens alternés, vitesses différentes
  ctx.save(); ctx.translate(CX, CY); ctx.lineCap = 'round';
  const rings = [
    { r: 1.22, w: 2.5, segs: 3, gap: 0.55, dir: 1, sp: 1.0, a: 0.9 },
    { r: 1.42, w: 1.2, segs: 8, gap: 0.25, dir: -1, sp: 0.55, a: 0.55 },
    { r: 1.62, w: 4, segs: 2, gap: 1.6, dir: 1, sp: 0.3, a: 0.35 },
  ];
  for (const g of rings) {
    ctx.strokeStyle = rgba(col, g.a); ctx.lineWidth = g.w;
    const base = rot * g.dir * g.sp, span = (Math.PI * 2) / g.segs;
    for (let i = 0; i < g.segs; i++) { ctx.beginPath(); ctx.arc(0, 0, R * g.r * pulse, base + i * span, base + (i + 1) * span - g.gap); ctx.stroke(); }
  }
  // Graduations
  ctx.strokeStyle = rgba(col, 0.35); ctx.lineWidth = 1;
  for (let i = 0; i < 72; i++) { const a = i / 72 * Math.PI * 2 + rot * 0.2, big = i % 6 === 0; ctx.beginPath();
    ctx.moveTo(Math.cos(a) * R * 1.88, Math.sin(a) * R * 1.88); ctx.lineTo(Math.cos(a) * R * (big ? 1.98 : 1.93), Math.sin(a) * R * (big ? 1.98 : 1.93)); ctx.stroke(); }
  // Balayage radar quand il écoute
  if (m.listening > 0.02) { const sw = ctx.createConicGradient ? ctx.createConicGradient(sweep, 0, 0) : null;
    if (sw) { sw.addColorStop(0, rgba(col, 0.28 * m.listening)); sw.addColorStop(0.18, 'rgba(0,0,0,0)'); sw.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sw; ctx.beginPath(); ctx.arc(0, 0, R * 1.85, 0, Math.PI * 2); ctx.fill(); } }
  // Onde circulaire de la voix (quand il parle ou qu'on parle)
  const wa = Math.max(m.speaking, m.listening * 0.7);
  if (wa > 0.02) { ctx.strokeStyle = rgba(col, 0.75 * wa); ctx.lineWidth = 1.5; ctx.beginPath();
    for (let i = 0; i <= wave.length; i++) { const k = i % wave.length, a = i / wave.length * Math.PI * 2 - Math.PI / 2;
      const rr = R * (1.02 + wave[k] * 0.3 * wa); const x = Math.cos(a) * rr, y = Math.sin(a) * rr; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke(); }
  ctx.restore();

  // --- Cœur
  const core = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 0.95 * pulse);
  core.addColorStop(0, `rgba(255,255,255,${0.85 + S.level * 0.15})`); core.addColorStop(0.25, rgba(col, 0.75)); core.addColorStop(0.7, rgba(col, 0.12)); core.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(CX, CY, R * 0.95 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = rgba(col, 0.9); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(CX, CY, R * 0.62 * pulse, 0, Math.PI * 2); ctx.stroke();
  // Réflexion pendant la pensée : petits arcs qui tournent vite autour du cœur
  if (m.thinking + m.tool > 0.02) { const k = m.thinking + m.tool; ctx.save(); ctx.translate(CX, CY); ctx.rotate(-rot * 3); ctx.strokeStyle = rgba(col, 0.9 * k); ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, 0, R * 0.78, i * 2.1, i * 2.1 + 0.9); ctx.stroke(); } ctx.restore(); }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
connect();
</script>
</body>
</html>
